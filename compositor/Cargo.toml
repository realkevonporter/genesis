[package]
name = "genesis-compositor"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Genesis — the SevynOS-only Wayland compositor (Smithay/Rust)"

[[bin]]
name = "sevyn-compositor"
path = "src/main.rs"

[dependencies]
# Smithay 0.7.0, pinned (see COMPOSITOR_PLAN.md, "Language: Rust").
#
# Stage 2 is the nested compositor only, so only the features it needs are
# enabled — deliberately NOT the default set:
#   backend_winit     — the nested backend: Genesis runs as a Wayland client
#                       (a winit window) inside the parent compositor.
#   wayland_frontend  — the Wayland server side (compositor, shm, output,
#                       seat, xdg-shell).
#   desktop           — Space + Window: the compositor-owned scene. Genesis
#                       places every surface; clients never position
#                       themselves (this is the property Stage 4 adoption
#                       relies on).
#   renderer_gl       — the GLES renderer used by the winit backend.
#
# Stage 3 (standalone) adds:
#   backend_drm       — DRM/KMS: DrmDevice, DrmSurface, DrmCompositor.
#   backend_gbm       — GBM: the allocator behind the DRM swapchain, the
#                       EGL-on-GBM display, and the framebuffer exporter.
#                       (Required by backend::drm::compositor itself: the
#                       module is gated on backend_gbm, not backend_drm.)
#   backend_libinput  — libinput pointer/keyboard/touch input.
#   backend_udev      — udev device discovery (which DRM nodes exist).
#   backend_session   — the session trait (open devices, VT switch).
#   backend_session_libseat — the libseat implementation of that trait.
#                       (`backend_session` alone is only the trait; the
#                       libseat backend is the separate feature that pulls
#                       the libseat system library.)
#   renderer_pixman   — the Pixman software renderer: the fallback when
#                       GLES init fails, or when forced off.
#
# NOT enabled (each arrives with its stage, per the plan):
#   xwayland — never (no X clients on SevynOS).
#   backend_vulkan / renderer_glow — not needed.
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session",
    "backend_session_libseat",
    "renderer_pixman",
] }
# Signal handling only (SIGTERM/SIGINT → clean shutdown). Already a
# transitive dependency via Smithay; listed directly so the use is explicit.
libc = "0.2"
# Calloop event loop + signal sources for the standalone backend.
# Smithay re-exports calloop 0.14 but does not enable its `signals`
# feature (non-default), so the standalone backend depends on calloop
# directly with it; feature unification makes it the same locked
# 0.14.5 crate Smithay uses.
calloop = { version = "0.14", features = ["signals"] }
# Bridge socket messages (newline-delimited JSON, protocol version 1).
# Already in the lockfile as transitive dependencies; listed directly.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `zwlr_foreign_toplevel_manager_v1` (Stage 4): Smithay 0.7.0 ships the
# list side (`ext-foreign-toplevel-list-v1`) but NOT the manager global,
# so Genesis implements it from the maintained generated types in
# `wayland-protocols-wlr` (see COMPOSITOR_PLAN.md, "Language: Rust" —
# `foreign_toplevel::v1`, client + server modules). Already in the
# lockfile as a transitive dependency (0.3.12); listed directly with
# the `server` feature only — Genesis is the server side here.
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
