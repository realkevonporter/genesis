name: Genesis CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sevynos/graphics typecheck
      - run: pnpm --filter @sevynos/graphics test
      - run: pnpm --filter @sevynos/graphics build

  compositor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compositor build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            meson \
            ninja-build
      - run: meson setup build compositor
      - run: meson compile -C build

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx prettier@3.9.6 --check .
