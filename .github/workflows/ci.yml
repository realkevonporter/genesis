name: Genesis CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # No root package.json in this repo (the model is the only package),
      # so pnpm/action-setup has no packageManager field to read: pin the
      # version explicitly. Matches sevynos's pnpm@11.17.0 pin.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sevynos/graphics typecheck
      - run: pnpm --filter @sevynos/graphics test
      - run: pnpm --filter @sevynos/graphics build

  compositor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # GitHub's ubuntu runners ship Rust via rustup; rust-toolchain.toml
      # pins the stable channel.
      - name: Install compositor build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libudev-dev \
            libinput-dev \
            libgbm-dev \
            libseat-dev \
            libpixman-1-dev \
            wayland-protocols \
            weston \
            xvfb \
            xdotool
      - name: Build the Rust compositor
        working-directory: compositor
        run: cargo build --locked
      - name: Lint the Rust compositor
        working-directory: compositor
        run: cargo clippy --locked -- -D warnings
      - name: Check Rust formatting
        working-directory: compositor
        run: cargo fmt --check
      - name: Build the C test client
        run: |
          wayland-scanner client-header /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml /tmp/xdg-shell-client-protocol.h
          wayland-scanner private-code /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml /tmp/xdg-shell-protocol.c
          wayland-scanner client-header /usr/share/wayland-protocols/stable/presentation-time/presentation-time.xml /tmp/presentation-time-client-protocol.h
          wayland-scanner private-code /usr/share/wayland-protocols/stable/presentation-time/presentation-time.xml /tmp/presentation-time-protocol.c
          gcc -o /tmp/sevyn-test-client compositor/tests/test-client.c /tmp/xdg-shell-protocol.c /tmp/presentation-time-protocol.c -I/tmp $(pkg-config --cflags --libs wayland-client)
      # The Stage 2 nested check: boots the compositor under headless
      # Weston, connects the real test client, and asserts the nested
      # milestone markers (output created, surface accepted + associated,
      # input routed, bridge close, clean shutdown, no orphans). It
      # proves function, not fps — the GF65 is the fps proof.
      # (libegl-mesa0 is Weston's GL dependency; without it the winit
      # backend cannot create its EGL context under Weston.)
      - name: Run the nested compositor check
        run: |
          sudo apt-get install -y -qq libegl-mesa0
          compositor/tests/nested-check.sh

      # The screen-capture check: boots the same nested stack and
      # proves the bridge `capture` op — a valid PNG with the
      # compositor's actual pixels, overwrite with no history, S3
      # refusal for sensitive layer + toplevel stand-ins, and
      # malformed requests leaving the compositor alive.
      - name: Run the screen capture check
        run: compositor/tests/capture-check.sh

      # The real-Chromium adoption check (Stage 5): boots the same
      # nested stack, launches a real Chromium snapshot against it,
      # adopts it into a Browser rect over the bridge, and proves the
      # same buffer relocated with its geometry at the rect origin
      # and no page/titlebar/infobar pixel outside it (no second
      # window, clipped) — then resize via compositor configure and
      # Chromium death emptying the content area.
      # (The libraries below are the snapshot's link closure, as in
      # the Stage 4 spike's guest package list; unzip is the
      # snapshot's unpacker.)
      - name: Run the real-Chromium adoption check
        run: |
          sudo apt-get install -y -qq \
            unzip \
            libnss3 \
            libnspr4 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libcups2t64 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0t64 \
            libexpat1 \
            libxcb1 \
            libxext6 \
            fonts-liberation
          compositor/tests/real-chromium-adoption-check.sh

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # See the model job: no root package.json, so pin pnpm explicitly.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx prettier@3.9.6 --check .
